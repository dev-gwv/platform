# Overlay for a VPS that runs Coolify. Coolify's Traefik ("coolify-proxy") owns
# 80/443 and issues Let's Encrypt certs, so we DON'T run our own Caddy or publish
# host ports — the API is attached to Coolify's proxy network and routed by
# Traefik labels instead.
#
# Bring up (caddy intentionally omitted):
#   docker compose -f docker-compose.yml -f docker-compose.coolify.yml up -d --build --wait db api cron
#
# Requires API_DOMAIN in .env (your DuckDNS host) pointing at this VPS. The API
# also answers on API_ALT_DOMAIN (default api.studioautopilot.in).
services:
  api:
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.services.ipcapi.loadbalancer.server.port=8787
      # https router (TLS via Coolify's letsencrypt resolver)
      - "traefik.http.routers.ipcapi.rule=Host(`${API_DOMAIN}`)"
      - traefik.http.routers.ipcapi.entrypoints=https
      - traefik.http.routers.ipcapi.tls=true
      - traefik.http.routers.ipcapi.tls.certresolver=letsencrypt
      # http router -> redirect to https (also serves the ACME http-01 challenge)
      - "traefik.http.routers.ipcapi-http.rule=Host(`${API_DOMAIN}`)"
      - traefik.http.routers.ipcapi-http.entrypoints=http
      - traefik.http.routers.ipcapi-http.middlewares=ipcapi-redirect
      - traefik.http.middlewares.ipcapi-redirect.redirectscheme.scheme=https
      # The same API on the brand's own address. A router of its own, so its
      # certificate is issued separately: if this name's DNS is not in place
      # yet, only this router waits -- API_DOMAIN keeps serving. Point an A
      # record at the VPS and turn Cloudflare's proxy ON (orange cloud, SSL
      # mode Full (strict)): some home internet providers cannot reach the
      # VPS address directly, and the app then fails with "Failed to fetch"
      # on their Wi-Fi while a phone hotspot works. lib/client-ip.ts reads
      # the person's address from CF-Connecting-IP only when the peer is
      # really Cloudflare.
      - "traefik.http.routers.ipcapi-alt.rule=Host(`${API_ALT_DOMAIN:-api.studioautopilot.in}`)"
      - traefik.http.routers.ipcapi-alt.entrypoints=https
      - traefik.http.routers.ipcapi-alt.tls=true
      - traefik.http.routers.ipcapi-alt.tls.certresolver=letsencrypt
      - traefik.http.routers.ipcapi-alt.service=ipcapi
      - "traefik.http.routers.ipcapi-alt-http.rule=Host(`${API_ALT_DOMAIN:-api.studioautopilot.in}`)"
      - traefik.http.routers.ipcapi-alt-http.entrypoints=http
      - traefik.http.routers.ipcapi-alt-http.middlewares=ipcapi-redirect
      - traefik.http.routers.ipcapi-alt-http.service=ipcapi

networks:
  coolify:
    external: true
