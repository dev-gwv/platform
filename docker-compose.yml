# Self-hosted VPS BACKEND: Postgres + Bun API + Caddy (TLS) + cron ticker
# + nightly database backups.
# No Supabase. The web frontend deploys separately to Cloudflare Pages.
#
#   cp deploy/.env.example .env   # fill in secrets + domains
#   docker compose up -d --build
#
# The `migrate` service runs on every `up`: idempotent bootstrap + any pending
# migrations (tracked in schema_migrations). The API connects as the
# `authenticator` role and SET ROLEs per request, so RLS is enforced exactly as
# it was on Supabase.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ipc}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ipc}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot: applies bootstrap + pending migrations, then exits. Runs on every
  # deploy; api waits for it to finish successfully.
  migrate:
    image: postgres:16
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file: [.env]
    environment:
      PGHOST: db
    volumes:
      - ./deploy/db/00_bootstrap.sql:/db/00_bootstrap.sql:ro
      - ./supabase/migrations:/db/migrations:ro
      - ./deploy/db/migrate.sh:/db/migrate.sh:ro
    entrypoint: ["sh", "/db/migrate.sh"]

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: [.env]
    environment:
      PORT: 8787
      # Built from the db credentials — the API is the `authenticator` role.
      DATABASE_URL: postgres://authenticator:${DB_AUTHENTICATOR_PASSWORD}@db:5432/${POSTGRES_DB:-ipc}
    expose:
      - "8787"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Nightly pg_dump -> the db_backups volume -> optional off-box S3/R2 copy.
  # Runs once at container start (so every deploy leaves a fresh snapshot and a
  # broken backup path surfaces immediately), then daily at BACKUP_AT_UTC.
  # Reports UNHEALTHY when the newest backup goes stale, so backups that quietly
  # stop happening show up in `docker compose ps` instead of at restore time.
  backup:
    build:
      context: deploy/backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # A startup dump taken mid-migration would bless a half-migrated schema
      # as "the backup". Wait for the ledger like api does.
      migrate:
        condition: service_completed_successfully
    env_file: [.env]
    environment:
      PGHOST: db
    volumes:
      - db_backups:/backups
    healthcheck:
      # Cheap (a stat on a marker file), so poll often — that keeps `up --wait`
      # from blocking a deploy while it waits for the first probe.
      test: ["CMD", "sh", "/backup/backup.sh", "health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 5m

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    env_file: [.env]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Replaces the Workers cron trigger: POST /cron/reminders every hour with the
  # shared secret. Idempotent server-side, so an occasional double-fire is safe.
  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    depends_on:
      - api
    env_file: [.env]
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          curl -fsS -X POST "http://api:8787/cron/reminders" \
            -H "x-cron-secret: $${CRON_SECRET}" >/dev/null 2>&1 || true
          sleep 3600
        done

  # The messaging worker: POST /cron/messages every five minutes sends what
  # the messaging wallet queued (WhatsApp templates, emails) and refunds any
  # failure. Its own ticker because an hour is too long for "your leave was
  # approved" to reach a phone.
  cron-messages:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    depends_on:
      - api
    env_file: [.env]
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          curl -fsS -X POST "http://api:8787/cron/messages" \
            -H "x-cron-secret: $${CRON_SECRET}" >/dev/null 2>&1 || true
          sleep 300
        done

  # The nightly attendance sweep: every active member with no row for today
  # gets an `absent` one. Its own ticker because it must run ONCE, after the
  # working day -- 18:30 UTC is midnight in Asia/Kolkata, which is when the
  # old app ran it. Folding it into the hourly loop above would mark everyone
  # absent at 1am and rely on check-in flipping them back, making any absence
  # figure read during the day a lie.
  #
  # Fires on the first tick at or after 18:30 UTC and then not again until the
  # UTC date changes, so a restart late in the evening still catches the day
  # up exactly once. The job itself is idempotent regardless.
  cron-attendance:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    depends_on:
      - api
    env_file: [.env]
    entrypoint: ["sh", "-c"]
    command:
      - |
        last=""
        while true; do
          today=$$(date -u +%Y-%m-%d)
          # 10# so that 0905 is nine-oh-five and not a bad octal literal.
          hm=$$((10#$$(date -u +%H%M)))
          if [ "$$hm" -ge 1830 ] && [ "$$last" != "$$today" ]; then
            if curl -fsS -X POST "http://api:8787/cron/attendance" \n                 -H "x-cron-secret: $${CRON_SECRET}" >/dev/null 2>&1; then
              last="$$today"
            fi
          fi
          sleep 300
        done

volumes:
  db_data:
  db_backups:
  caddy_data:
  caddy_config:
