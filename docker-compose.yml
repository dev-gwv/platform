# Self-hosted VPS BACKEND: Postgres + Bun API + Caddy (TLS) + cron ticker
# + nightly database backups.
# No Supabase. The web frontend deploys separately to Cloudflare Pages.
#
#   cp deploy/.env.example .env   # fill in secrets + domains
#   docker compose up -d --build
#
# The `migrate` service runs on every `up`: idempotent bootstrap + any pending
# migrations (tracked in schema_migrations). The API connects as the
# `authenticator` role and SET ROLEs per request, so RLS is enforced exactly as
# it was on Supabase.
#
# Every service keeps at most 3 x 10 MB of logs (Docker's default json-file
# log grows until the disk is full), and every service but db has a memory
# ceiling so one runaway container cannot starve Postgres or the other
# projects on this shared box.

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# The three curl tickers: tiny, killed at once on a deploy (a sleeping shell
# ignores SIGTERM, so the default 10 s grace was 10 s of waiting per ticker),
# and started only once the API answers its healthcheck.
x-ticker: &ticker
  image: curlimages/curl:8.10.1
  restart: unless-stopped
  stop_grace_period: 1s
  mem_limit: 64m
  depends_on:
    api:
      condition: service_healthy
  env_file: [.env]
  entrypoint: ["sh", "-c"]
  <<: *logging

services:
  db:
    image: postgres:16
    restart: unless-stopped
    <<: *logging
    # Stock Postgres keeps 128 MB of pages in memory and plans for a spinning
    # disk. The VPS is a Hostinger KVM 4 (Mumbai): 4 cores, 16 GB of RAM and an
    # SSD, shared with the other Coolify projects on it (speed audit, 11-12 Nov).
    # shared_buffers is 2 GB (1/8 of the box rather than the usual 1/4, because
    # the box is shared), effective_cache_size 8 GB tells the planner about the
    # OS page cache it can count on, work_mem 16 MB per sort/hash (the API's
    # pool is 20, so worst case stays well under a gigabyte), 256 MB for
    # VACUUM / CREATE INDEX, and random_page_cost 1.1 lets it use indexes freely.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=8GB
      - -c
      - random_page_cost=1.1
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
    # shared_buffers is an anonymous mmap on Linux and does not live in
    # /dev/shm, but parallel query's hash tables and sorts do (dynamic shared
    # memory). Docker's 64 MB default can fail a parallel hash join with "could
    # not resize shared memory segment"; 256 MB leaves room at work_mem=16MB.
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ipc}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ipc}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot: applies bootstrap + pending migrations, then exits. Runs on every
  # deploy; api waits for it to finish successfully.
  migrate:
    image: postgres:16
    restart: "no"
    <<: *logging
    depends_on:
      db:
        condition: service_healthy
    env_file: [.env]
    environment:
      PGHOST: db
    volumes:
      - ./deploy/db/00_bootstrap.sql:/db/00_bootstrap.sql:ro
      - ./supabase/migrations:/db/migrations:ro
      - ./deploy/db/migrate.sh:/db/migrate.sh:ro
    entrypoint: ["sh", "/db/migrate.sh"]

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    mem_limit: 2g
    <<: *logging
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: [.env]
    environment:
      PORT: 8787
      # Built from the db credentials — the API is the `authenticator` role.
      DATABASE_URL: postgres://authenticator:${DB_AUTHENTICATOR_PASSWORD}@db:5432/${POSTGRES_DB:-ipc}
      # The commit being run, for /health and Sentry. deploy/deploy.sh passes
      # it in the environment for this service alone, so a new commit id does
      # not recreate backup, migrate and the tickers on every deploy.
      APP_VERSION: ${APP_VERSION:-}
    expose:
      - "8787"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Nightly pg_dump -> the db_backups volume -> optional off-box S3/R2 copy.
  # Runs once at container start (so every deploy leaves a fresh snapshot and a
  # broken backup path surfaces immediately), then daily at BACKUP_AT_UTC.
  # Reports UNHEALTHY when the newest backup goes stale, so backups that quietly
  # stop happening show up in `docker compose ps` instead of at restore time.
  backup:
    build:
      context: deploy/backup
    restart: unless-stopped
    mem_limit: 1g
    <<: *logging
    depends_on:
      db:
        condition: service_healthy
      # A startup dump taken mid-migration would bless a half-migrated schema
      # as "the backup". Wait for the ledger like api does.
      migrate:
        condition: service_completed_successfully
    env_file: [.env]
    environment:
      PGHOST: db
      # ENVIRONMENT arrives through env_file (.env): backup.sh health reports
      # unhealthy in production while there is no off-box copy (BACKUP_S3_BUCKET).
    volumes:
      - db_backups:/backups
    healthcheck:
      # Cheap (a stat on a marker file), so poll often — that keeps `up --wait`
      # from blocking a deploy while it waits for the first probe.
      test: ["CMD", "sh", "/backup/backup.sh", "health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 5m

  caddy:
    image: caddy:2
    restart: unless-stopped
    <<: *logging
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    env_file: [.env]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Replaces the Workers cron trigger: POST /cron/reminders every hour with the
  # shared secret. Idempotent server-side, so an occasional double-fire is safe.
  cron:
    <<: *ticker
    command:
      - |
        while true; do
          curl -fsS -X POST "http://api:8787/cron/reminders" \
            --retry 10 --retry-connrefused --retry-delay 3 \
            -H "x-cron-secret: $${CRON_SECRET}" >/dev/null 2>&1 || true
          sleep 3600
        done

  # The messaging worker: POST /cron/messages every five minutes sends what
  # the messaging wallet queued (WhatsApp templates, emails) and refunds any
  # failure. Its own ticker because an hour is too long for "your leave was
  # approved" to reach a phone.
  cron-messages:
    <<: *ticker
    command:
      - |
        while true; do
          curl -fsS -X POST "http://api:8787/cron/messages" \
            --retry 10 --retry-connrefused --retry-delay 3 \
            -H "x-cron-secret: $${CRON_SECRET}" >/dev/null 2>&1 || true
          sleep 300
        done

  # The nightly attendance sweep: every active member with no row for today
  # gets an `absent` one. Its own ticker because it must run ONCE, after the
  # working day -- 18:30 UTC is midnight in Asia/Kolkata, which is when the
  # old app ran it. Folding it into the hourly loop above would mark everyone
  # absent at 1am and rely on check-in flipping them back, making any absence
  # figure read during the day a lie.
  #
  # Fires on the first tick at or after 18:30 UTC and then not again until the
  # UTC date changes, so a restart late in the evening still catches the day
  # up exactly once. The job itself is idempotent regardless.
  cron-attendance:
    <<: *ticker
    command:
      - |
        last=""
        while true; do
          today=$$(date -u +%Y-%m-%d)
          # 10# so that 0905 is nine-oh-five and not a bad octal literal.
          hm=$$((10#$$(date -u +%H%M)))
          if [ "$$hm" -ge 1830 ] && [ "$$last" != "$$today" ]; then
            if curl -fsS -X POST "http://api:8787/cron/attendance" \
                 --retry 10 --retry-connrefused --retry-delay 3 \
                 -H "x-cron-secret: $${CRON_SECRET}" >/dev/null 2>&1; then
              last="$$today"
            fi
          fi
          sleep 300
        done

  # The support group bot (0280, deploy/wa-bot): a spare WhatsApp number linked
  # like WhatsApp Web, posting support call alerts into one group. No published
  # port: only the API reaches it, on this network, with WA_BOT_SECRET. It gets
  # that secret and its caps, never the rest of .env. Its link to the phone and
  # its send log live in wa_bot_data, so a rebuild keeps it linked. Link it from
  # Platform -> Support calls (scan the QR with the spare phone).
  wa-bot:
    build:
      context: deploy/wa-bot
    restart: unless-stopped
    mem_limit: 512m
    <<: *logging
    environment:
      WA_BOT_SECRET: ${WA_BOT_SECRET:-}
      WA_BOT_HOURLY_CAP: ${WA_BOT_HOURLY_CAP:-30}
      WA_BOT_DAILY_CAP: ${WA_BOT_DAILY_CAP:-150}
    volumes:
      - wa_bot_data:/data
    expose:
      - "3001"

volumes:
  wa_bot_data:
  db_data:
  db_backups:
  caddy_data:
  caddy_config:
