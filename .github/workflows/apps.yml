name: Apps

# Builds the installable apps (native/): Windows, Mac and Linux from
# native/desktop (Electron), and Android from native/android (an APK).
# Every app shows the live site, so a web change never needs a new build --
# only a change under native/ does.
#
#   A push to a branch (not main) that    -> all four build; the files are on the
#   touches native/                          run's page under Artifacts (14 days).
#   Push a tag apps-v1.0.1               -> the same, plus a GitHub Release with
#                                            every file attached.
#   Actions -> Apps -> Run workflow      -> build on demand.
#
# Android signing: repo secrets ANDROID_KEYSTORE_B64 (the keystore, base64)
# and ANDROID_KEYSTORE_PASSWORD. Without them the APK is signed with a
# throwaway key and named "-test-key": it installs, but Chrome shows the
# address bar and a phone with the real app will not take it as an update.
# docs/apps.md says how to set them.

on:
  push:
    # Any branch but main (a pull request's branch included), only when the apps change.
    branches-ignore: [main]
    paths:
      - 'native/**'
      - '.github/workflows/apps.yml'
    # A release; path filters do not apply to tags.
    tags: ['apps-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
          - name: Mac
            os: macos-latest
            target: --mac
          - name: Linux
            os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: native/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#apps-v}"
          if [[ "$GITHUB_REF" == refs/tags/apps-v* ]]; then
            npx electron-builder ${{ matrix.target }} --publish never -c.extraMetadata.version="$VERSION"
          else
            npx electron-builder ${{ matrix.target }} --publish never
          fi
        env:
          # No Apple / Windows signing certificate yet: never go looking for one.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Check the Mac app's signature
        if: matrix.name == 'Mac'
        run: |
          for app in dist/mac*/*.app; do
            echo "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: studio-autopilot-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: error
          path: |
            native/desktop/dist/*.exe
            native/desktop/dist/*.dmg
            native/desktop/dist/*.AppImage
            native/desktop/dist/*.deb

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/apps-v') && github.ref_name || '1.0.0' }}
        run: |
          VERSION_NAME="${VERSION_NAME#apps-v}"
          # Each release must count up, or Android refuses it as an update.
          export VERSION_NAME VERSION_CODE="${{ github.run_number }}"
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.p12"
          fi
          bash native/android/build.sh
          rm -f "$RUNNER_TEMP/release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: studio-autopilot-Android
          retention-days: 14
          if-no-files-found: error
          path: native/android/build/*.apk

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/apps-v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la files
          gh release create "${{ github.ref_name }}" files/* \
            --repo "${{ github.repository }}" \
            --title "Studio AutoPilot apps ${{ github.ref_name }}" \
            --notes "Windows (.exe), Mac (.dmg: arm64 for Apple chips, x64 for Intel), Linux (.AppImage, .deb) and Android (.apk). How to install: docs/apps.md."
