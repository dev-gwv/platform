name: Probe live site (temporary)
on:
  push:
    branches: [claude/practical-fermat-cusrmh]
    paths: ['.github/workflows/probe-live.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          A=https://ipcstudios.duckdns.org
          echo "== DNS"; getent ahosts ipcstudios.duckdns.org; dig +short ipcstudios.duckdns.org @1.1.1.1; dig +short ipcstudios.duckdns.org @8.8.8.8
          echo "== preflight"; curl -sS -m 30 -D - -o /dev/null -X OPTIONS "$A/auth/login" -H 'Origin: https://studioautopilot.in' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type'
          echo "== post"; curl -sS -m 30 -D - -o /dev/null -X POST "$A/auth/login" -H 'Origin: https://studioautopilot.in' -H 'Content-Type: application/json' -d '{"email":"probe-nobody@example.com","password":"wrong-password-123"}'
          echo "== TLS"; echo | openssl s_client -connect ipcstudios.duckdns.org:443 -servername ipcstudios.duckdns.org 2>/dev/null | openssl x509 -noout -dates -issuer -subject
          echo "== timing x5"; for i in 1 2 3 4 5; do curl -sS -m 30 -o /dev/null -w "%{http_code} connect=%{time_connect} tls=%{time_appconnect} total=%{time_total}\n" "$A/health"; done
